name: Import KR platform snapshot

on:
  push:
    paths:
      - '.github/workflows/import-kr-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KR destination
        uses: actions/checkout@v4
        with:
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout prepared KR source
        uses: actions/checkout@v4
        with:
          repository: ChaewonNa/cosmetic-regulatory-us
          ref: kr-independent-infra-prep
          path: source

      - name: Copy KR application into independent repository
        shell: bash
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='azure/postgres/0001_us_fresh_schema.sql' \
            source/ target/

      - name: Commit imported KR application
        shell: bash
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No import changes to commit.'
          else
            git commit -m 'Import KR platform application and Azure infrastructure prep'
            git push origin HEAD:main
          fi
